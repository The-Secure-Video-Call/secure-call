# Lets you write "@claude <request>" in an issue, PR comment or PR review.
# Claude reads the repo (including CLAUDE.md and PLAN.md), does the work,
# pushes a branch, and replies with a link to open a pull request.
# Only people with write access to the repo can trigger it.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Node + pnpm so Claude can install dependencies and run the project's checks.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: anthropics/claude-code-action@v1
        with:
          # Runs on the maintainer's Claude subscription (token from `claude setup-token`).
          # Console promotional API credits don't cover Claude Code / this Action.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # To pay with purchased Console API credits instead, replace the line above with:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude may run exactly these pnpm commands (plain `pnpm install` only, so it
          # can't add packages from the command line), with up to 150 turns (steps) per job.
          claude_args: '--max-turns 150 --allowedTools "Bash(pnpm install),Bash(pnpm lint),Bash(pnpm format),Bash(pnpm typecheck),Bash(pnpm test:*),Bash(pnpm build)"'
