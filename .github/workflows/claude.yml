# Lets you write "@claude <request>" in an issue, PR comment or PR review.
# Claude reads the repo (including CLAUDE.md and PLAN.md), does the work,
# pushes a branch, and replies with a link to open a pull request.
# Only people with write access to the repo can trigger it.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Read-only copy of the other repo's latest main, so Claude can read its code like a
      # teammate on the other team would. It has no credentials and .gitignore lists
      # .reference/, so it can never be changed or committed from here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: The-Secure-Video-Call/secure-call-backend
          path: .reference/secure-call-backend
          fetch-depth: 1
          persist-credentials: false

      # Node + pnpm so Claude can install dependencies and run the project's checks.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          # Runs on the maintainer's Claude subscription (token from `claude setup-token`).
          # Console promotional API credits don't cover Claude Code / this Action.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # To pay with purchased Console API credits instead, replace the line above with:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude may run only these commands, with up to 150 turns (steps) per job:
          # - the project's checks (pnpm lint, format, typecheck, test, build, protocol:sync)
          # - `pnpm install` without package names, so it can't add packages from the command line
          # - read-only helpers: tail/head/wc to shorten output, git status/diff/log
          claude_args: '--max-turns 150 --allowedTools "Bash(pnpm install),Bash(pnpm install --frozen-lockfile),Bash(pnpm lint:*),Bash(pnpm format:*),Bash(pnpm typecheck:*),Bash(pnpm test:*),Bash(pnpm build:*),Bash(pnpm protocol:sync:*),Bash(tail:*),Bash(head:*),Bash(wc:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"'
