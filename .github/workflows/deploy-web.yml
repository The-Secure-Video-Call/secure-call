# CD: builds the web app and uploads it to securevideocall.com (ServerByt hosting) over
# encrypted FTP (FTPS). Runs after every push to main, i.e. every merged PR, and can be
# started by hand from the Actions tab.
#
# Separate jobs, so third-party code never runs next to the FTP password:
# - build: installs, checks and builds with no secrets and no environment. pnpm install,
#   eslint, vitest and vite all run here, where there is nothing to steal.
# - rebuild: builds the same commit again on macOS with almost no environment. Nothing is
#   uploaded unless both builds are byte-identical.
# - sbom: writes the SBOM of the production dependencies from the lockfile alone. Nothing is
#   installed and no dependency code runs there.
# Artifacts are passed by their ID (each job's output), never by name: a job that runs
# third-party code could replace a named artifact of this run, but not change another job's
# outputs, and a replaced artifact gets a new ID.
# - deploy (main only): waits until a reviewer of the "production" environment approves it,
#   then uploads exactly the files the build job made. No checkout, no Node and no project
#   code run here; only the downloaded files, shell checks and lftp from Ubuntu's own packages.
# - release (main only): after a successful upload, publishes SHA256SUMS of exactly those
#   files and the SBOM as the GitHub Release "web-<commit>", both attested as made by this
#   workflow on main, so anyone can check the live site against this repository
#   (scripts/verify-deployed.mjs, SECURITY.md) or rebuild the commit and compare.
#
# Settings live in the "production" environment: variables FTP_SERVER and FTP_USERNAME,
# secret FTP_PASSWORD.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer one waits instead of interrupting an upload.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No cache: what is deployed is installed clean from the lockfile, never from a cache
      # another workflow (for example the e2e job, which runs unreviewed upstream code) wrote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Never ship what CI would reject: the same pin check and audits as ci.yml, before install.
      - run: node scripts/check-pinned-actions.mjs
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm audit --audit-level high
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # The commit's time as the build time, so the output depends only on the commit.
      - name: Build
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" pnpm build
      # The built app: SRI hashes match the files, no inline code, every security header from
      # PLAN.md 3.5 present and not weakened (apps/web/build-tools/).
      - name: Check the built app
        run: pnpm --filter @secure-call/web check:build

      # Hidden files are left out by default, which would drop .htaccess (the CSP and every
      # security header), so they are included. Kept 5 days, so a later approval still finds it.
      - name: Keep the built site for the deploy job
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5

  # A second build of the same commit on another runner: another OS, CPU and native build
  # binaries, a fresh install with no cache, another time zone and locale, and almost no
  # environment variables. The deploy job uploads nothing unless its files equal the build
  # job's byte for byte. That catches tampering specific to one OS or runner, and code that
  # reacts to CI environment variables. It does NOT catch code that recognises a deploy some
  # other way (the checkout's branch, the event file on disk) and behaves the same on both, nor
  # code that is malicious everywhere: rebuilds outside GitHub Actions are the backstop for
  # those (SECURITY.md). ci.yml's reproducible-build job runs the same comparison on every PR.
  rebuild:
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install and build with almost no environment
        run: |
          commit_time="$(git log -1 --format=%ct)"
          umask 077
          env -i PATH="$PATH" HOME="$HOME" LANG=C TZ=Pacific/Auckland pnpm install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" LANG=C TZ=Pacific/Auckland SOURCE_DATE_EPOCH="$commit_time" pnpm build
      - name: Keep the rebuilt site for the comparison
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist-rebuild
          path: apps/web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5

  # The SBOM (CycloneDX 1.6, JSON) of the production dependencies, which are what ends up in the
  # bundle: every package with its version, purl, registry URL and the lockfile's SHA-512. Read
  # from pnpm-lock.yaml alone (--lockfile-only): nothing is installed, so no dependency code runs.
  # It has no licenses, which would need the packages themselves.
  # pnpm 10 (packageManager) has no `pnpm sbom`, so this one command runs pnpm 11, fetched by
  # corepack and pinned by its npm SHA-512 (corepack refuses any other file; Dependabot does not
  # update this pin). It runs here, with the read-only token, and not in the release job, so a
  # package downloaded from npm never runs where attestations can be signed.
  # serialNumber is random and timestamp the current time: both are removed (as cyclonedx-npm's
  # --output-reproducible does), so the same commit always gives the same bytes (SECURITY.md).
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # For corepack, which comes with Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # --pm-on-fail=ignore: pnpm 11 otherwise refuses to run in a project that names pnpm 10.
      - name: Write the SBOM from the lockfile
        env:
          SBOM_PNPM: pnpm@11.28.9+sha512.35421cea2720eca3f5ad722b67e8ef18f4d3cd4745ed2fcfeb0dc288d4e9437fad3870d91ee6e83f268f0f6f7e0f62723317b19617bb45ee4333172ef51159f8
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          corepack "$SBOM_PNPM" sbom --pm-on-fail=ignore --lockfile-only --prod \
            --sbom-format cyclonedx --sbom-spec-version 1.6 --sbom-type application > pnpm-sbom.json
          jq 'del(.serialNumber, .metadata.timestamp)' pnpm-sbom.json > sbom.cdx.json
          jq -se 'length == 1 and (.[0] | .bomFormat == "CycloneDX" and (.components | type == "array" and length > 0))' \
            sbom.cdx.json > /dev/null || { echo "pnpm wrote no SBOM with components."; exit 1; }
          jq -r '.components[] | "\(.name)@\(.version)"' sbom.cdx.json
      - name: Keep the SBOM for the release job
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 5

  deploy:
    # The SBOM job too: nothing goes live that its release could not be published for.
    needs: [build, rebuild, sbom]
    # Only main reaches production, whatever branch a manual run starts from (the production
    # environment allows main only as well).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://securevideocall.com
    # No token: the artifact of this run is fetched with the run's own runtime token.
    permissions: {}
    outputs:
      # SHA-256 of the SHA256SUMS of exactly what was uploaded; the release job must match it.
      uploaded-sums-digest: ${{ steps.compare.outputs.sums-digest }}
    steps:
      # The digest check catches a corrupted download; it does not vouch for the build itself.
      - name: Get the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: site
      - name: Get the rebuilt site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild.outputs.artifact-id }}
          path: rebuild

      # The build job runs third-party code, so its output is checked before anything reaches
      # the server. Without this, a hostile build could ship a .php file or another .htaccess
      # and get code running on the host without ever seeing the password. Checked:
      # - only regular files with expected names (no links, no other files; names never echoed);
      # - .htaccess (the CSP and every security header) byte for byte the repository's own at
      #   this commit, fetched without a token because the repository is public;
      # - every asset index.html points at is present, so `mirror --delete` below can never
      #   remove the live assets while index.html points at files that are not there.
      - name: Check the built site
        env:
          EXPECTED_HTACCESS_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/apps/web/public/.htaccess
        run: |
          set -f
          # Listings go to files first: with pipefail, `find | grep -q` can fail open when grep
          # exits early and find is killed by SIGPIPE.
          find site -mindepth 1 ! -type f ! -type d > special-entries.txt
          if [ -s special-entries.txt ]; then
            echo "the build contains links or special files"; exit 1
          fi
          find site -mindepth 1 > all-entries.txt
          if LC_ALL=C grep -qvxE 'site/(index\.html|\.htaccess|assets|assets/[A-Za-z0-9_-]+\.(js|css|svg|png|webp|ico|woff2))' all-entries.txt; then
            echo "the build contains unexpected files"; exit 1
          fi
          test -f site/index.html || { echo "index.html missing"; exit 1; }
          curl -fsSL --proto '=https' "$EXPECTED_HTACCESS_URL" -o expected.htaccess
          cmp -s expected.htaccess site/.htaccess || { echo ".htaccess differs from the repository"; exit 1; }
          referenced_assets=$( (grep -oE '(src|href)="/assets/[^"]*"' site/index.html || true) | sed -E 's#^[a-z]+="/##; s#"$##' | sort -u)
          [ -n "$referenced_assets" ] || { echo "index.html references no assets"; exit 1; }
          asset_count=0
          while IFS= read -r asset; do
            [[ "$asset" =~ ^assets/[A-Za-z0-9_-]+\.[a-z0-9]+$ ]] || { echo "unexpected asset reference"; exit 1; }
            test -f "site/$asset" || { echo "missing: $asset"; exit 1; }
            asset_count=$((asset_count + 1))
          done <<<"$referenced_assets"
          echo "site checked: index.html, .htaccess identical to the repository, $asset_count referenced assets"

      # The build job's files must equal the independent macOS rebuild's, every file and every
      # byte. File names are not printed: they come from builds that run third-party code.
      - name: Compare with the independent rebuild
        id: compare
        run: |
          (cd site && find . | LC_ALL=C sort) > site-entries.txt
          (cd rebuild && find . | LC_ALL=C sort) > rebuild-entries.txt
          (cd site && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > SHA256SUMS
          (cd rebuild && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > rebuild-SHA256SUMS
          if ! cmp -s site-entries.txt rebuild-entries.txt || ! cmp -s SHA256SUMS rebuild-SHA256SUMS; then
            echo "The build differs from the independent rebuild: not deploying."; exit 1
          fi
          echo "The build and the independent rebuild are byte-identical ($(wc -l < SHA256SUMS) files)."
          echo "sums-digest=$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # A deploy of a commit that already has a release (a re-run, a rollback) must upload
      # exactly what that release lists, checked before anything reaches the server. The
      # repository is public, so this needs no token; 404 means no release yet.
      - name: Compare with an existing release of this commit
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          url="https://github.com/$REPOSITORY/releases/download/web-${COMMIT:0:12}/SHA256SUMS"
          status="$(curl -sS --proto '=https' --proto-redir '=https' -L -o published-SHA256SUMS -w '%{http_code}' "$url")"
          case "$status" in
            404) echo "No release of this commit yet." ;;
            200)
              cmp -s SHA256SUMS published-SHA256SUMS || { echo "This commit's release lists other files: not deploying."; exit 1; }
              echo "Matches this commit's existing release." ;;
            *) echo "Could not check for an existing release (HTTP $status)."; exit 1 ;;
          esac

      # lftp, from Ubuntu's own packages: it handles the encrypted data connections this
      # FTP server requires (the Node-based deploy action had them reset).
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Encrypted control and data connections, certificate checked. Order matters: the new
      # assets go up first, then index.html that points at them, then .htaccess. Inside
      # assets/ old hashed files are removed; nothing else on the server is touched.
      # cmd:fail-exit stops at the first failed command (lftp's default carries on), so
      # index.html never goes up after a failed asset upload, and a failure fails the job.
      # The password reaches lftp only through LFTP_PASSWORD, never the command line.
      - name: Upload to securevideocall.com over FTPS
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" <<'LFTP'
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mirror --reverse --delete --verbose --no-perms --no-symlinks site/assets assets
          put -O . site/index.html
          put -O . site/.htaccess
          cls -l
          bye
          LFTP

  # The only job that can write to the repository (the release and its tag) or sign an
  # attestation. It has no secret and runs no project code: it hashes the artifact the deploy job
  # checked and uploaded (and refuses unless those hashes are the ones the deploy job recorded),
  # takes the SBOM from the sbom job (which runs no dependency code either), and reads the
  # toolchain versions from the repository at this commit over HTTPS (no checkout), never from
  # the build job, so nothing from there reaches it.
  release:
    needs: [build, deploy, sbom]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release and its tag
      id-token: write # the attestation's short-lived signing certificate (Sigstore, keyless)
      attestations: write # storing the attestation
    steps:
      - name: Get the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: site
      - name: Get the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sbom.outputs.artifact-id }}
          path: sbom
      # A release cannot be changed once published, so a broken SBOM must never reach one.
      - name: Check the SBOM
        run: |
          set -euo pipefail
          [ -f sbom/sbom.cdx.json ] && [ ! -L sbom/sbom.cdx.json ] || { echo "no sbom.cdx.json"; exit 1; }
          # One JSON document (-s reads them all), CycloneDX, with an array of components.
          jq -se 'length == 1 and (.[0] | .bomFormat == "CycloneDX" and (.components | type == "array" and length > 0))' \
            sbom/sbom.cdx.json > /dev/null || { echo "sbom.cdx.json is not a CycloneDX SBOM with components."; exit 1; }
          cp sbom/sbom.cdx.json sbom.cdx.json

      # - The hashes must be exactly the ones of the upload (the deploy job's output).
      # - An existing release (a re-run) must list the same hashes and its tag this commit;
      #   otherwise this fails instead of replacing anything. It must be published (not a draft)
      #   and have this SBOM, byte for byte (the same commit always gives the same SBOM): this
      #   code exists only at commits whose releases have one, so a release of this commit without
      #   it was made some other way, or broke off half-made.
      # - A new release's tag is created here first, atomically: if a tag of that name already
      #   exists, it is used only if it is this commit.
      - name: Hash the deployed files and prepare the tag
        id: hashes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          UPLOADED_SUMS_DIGEST: ${{ needs.deploy.outputs.uploaded-sums-digest }}
        run: |
          set -euo pipefail
          tag="web-${COMMIT:0:12}"
          (cd site && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > SHA256SUMS
          cat SHA256SUMS
          [[ "$UPLOADED_SUMS_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "The deploy job recorded no digest."; exit 1; }
          [ "$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" = "$UPLOADED_SUMS_DIGEST" ] || {
            echo "These are not the files the deploy job uploaded: not publishing."; exit 1; }
          check_tag() {
            local tag_target
            tag_target="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha')"
            [ "$tag_target" = "commit $COMMIT" ] || { echo "The tag $tag does not point at $COMMIT."; exit 1; }
          }
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json isDraft,assets --jq '(.isDraft | tostring) + " " + ([.assets[].name] | sort | join(" "))' > published-release.txt
            [ "$(cat published-release.txt)" = "false SHA256SUMS sbom.cdx.json" ] || {
              echo "$tag exists, but as a draft or without exactly SHA256SUMS and sbom.cdx.json. Not replacing it."; exit 1; }
            gh release download "$tag" --pattern SHA256SUMS --output published-SHA256SUMS
            cmp -s SHA256SUMS published-SHA256SUMS || {
              echo "$tag exists with DIFFERENT hashes: the build is not reproducible. Not replacing it."; exit 1; }
            gh release download "$tag" --pattern sbom.cdx.json --output published-sbom.cdx.json
            cmp -s sbom.cdx.json published-sbom.cdx.json || {
              echo "$tag exists with a DIFFERENT SBOM. Not replacing it."; exit 1; }
            check_tag
            echo "$tag is already published with these exact hashes (reproducible)."
            echo "is-new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$COMMIT" > /dev/null; then
            echo "Created the tag $tag."
          else
            check_tag
            echo "The tag $tag already exists and points at this commit."
          fi
          echo "is-new=true" >> "$GITHUB_OUTPUT"

      # Signed with a certificate that names this workflow file, main and this commit, so a
      # release made any other way (another workflow, a person) cannot carry it (SECURITY.md).
      # One attestation with both files as subjects, so `gh attestation verify` checks each the
      # same way, for the same workflow, branch and commit. No new action, and no predicate to
      # parse (actions/attest-sbom would put the SBOM itself in the predicate).
      # Always, also for an existing release: attesting the same files again is harmless,
      # and a release someone made in advance with these hashes still gets its attestation.
      - name: Attest SHA256SUMS and the SBOM as made by this workflow on main
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            SHA256SUMS
            sbom.cdx.json

      - name: Publish SHA256SUMS and the SBOM as a release
        if: steps.hashes.outputs.is-new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="web-${COMMIT:0:12}"
          raw="https://raw.githubusercontent.com/$GH_REPO/$COMMIT"
          curl -fsSL --proto '=https' "$raw/.node-version" -o node-version.txt
          curl -fsSL --proto '=https' "$raw/package.json" -o package.json
          node_version="$(tr -d '[:space:]' < node-version.txt)"
          pnpm_version="$(sed -n 's/.*"packageManager": *"pnpm@\([0-9.]*\)".*/\1/p' package.json)"
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected .node-version"; exit 1; }
          [[ "$pnpm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected packageManager"; exit 1; }
          {
            echo "The files deployed to https://securevideocall.com from commit $COMMIT."
            echo
            echo "Built with Node $node_version and pnpm $pnpm_version (pinned in the repository),"
            echo "with SOURCE_DATE_EPOCH set to the commit time. Before the upload, a second build on"
            echo "macOS produced byte-identical files."
            echo
            echo "Check the live site against this release, including who made it (needs gh):"
            echo
            echo "    node scripts/verify-deployed.mjs --release $tag"
            echo
            echo "or check the attestation of SHA256SUMS by hand:"
            echo
            echo "    gh attestation verify SHA256SUMS --repo $GH_REPO \\"
            echo "      --signer-workflow $GH_REPO/.github/workflows/deploy-web.yml \\"
            echo "      --source-ref refs/heads/main --source-digest $COMMIT --deny-self-hosted-runners"
            echo
            echo "or rebuild the commit yourself and compare (SECURITY.md)."
            echo
            echo "sbom.cdx.json is the SBOM (CycloneDX) of the production dependencies, from the"
            echo "lockfile at this commit. It is attested the same way: the same command with"
            echo "sbom.cdx.json in place of SHA256SUMS."
          } > release-notes.md
          # Every asset goes up here, at creation: a published release cannot get new ones.
          # --verify-tag: the tag made above must still exist; never let gh create one elsewhere.
          # --target: without it GitHub records the default branch's name as the release's commit.
          gh release create "$tag" SHA256SUMS sbom.cdx.json --verify-tag --target "$COMMIT" --title "Web app $tag" --notes-file release-notes.md
          tag_target="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha')"
          [ "$tag_target" = "commit $COMMIT" ] || { echo "The tag $tag does not point at $COMMIT."; exit 1; }
          published="$(gh release view "$tag" --json isDraft,assets --jq '(.isDraft | tostring) + " " + ([.assets[].name] | sort | join(" "))')"
          [ "$published" = "false SHA256SUMS sbom.cdx.json" ] || { echo "The release $tag is a draft or lacks an asset."; exit 1; }
          release_target="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.target_commitish')"
          [ "$release_target" = "$COMMIT" ] || { echo "The release $tag records $release_target, not $COMMIT."; exit 1; }
          echo "Published $tag."
