# Lint, type-check, test and build on every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every action pinned to a full commit SHA (a tag can be moved). Node standard library
      # only, so it runs on the runner's own Node before anything is installed.
      - name: Actions are pinned
        run: node scripts/check-pinned-actions.mjs

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Known vulnerabilities, from the lockfile alone, so before anything is downloaded.
      # Production dependencies run in people's browsers: moderate or worse fails. Dev
      # dependencies (eslint, vitest, and vite, which builds the bundle) run only here and in
      # the deploy: high or worse fails.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate
      - name: Audit all dependencies
        run: pnpm audit --audit-level high
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tests for the CI scripts
        run: node --test 'scripts/*.test.mjs'
      - run: pnpm build
      # The built app: SRI hashes match the files, no inline code, every security header from
      # PLAN.md 3.5 present and not weakened (apps/web/build-tools/).
      - name: Check the built app
        run: pnpm --filter @secure-call/web check:build

  # The M4 demo: two real browsers with fake cameras complete an encrypted call through the real
  # signaling server (secure-call-backend main, run from source), under the production CSP
  # (apps/web/playwright.config.ts, apps/web/e2e/). Runs PR code with the read-only token and no
  # secrets. Chromium runs every test; Firefox runs the full call.
  # No caches: this job runs code nobody here reviews (the backend's main and its PyPI packages,
  # uv, browsers from Playwright's CDN), so it must not write a cache other jobs restore.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The backend repository is public; its main branch is what production runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: The-Secure-Video-Call/secure-call-backend
          path: .reference/secure-call-backend
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile

      # The same uv as the backend's image (its Dockerfile pins it), not whatever is newest.
      - name: uv version of the backend
        id: backend-uv
        run: |
          uv_version="$(sed -n 's#^FROM ghcr.io/astral-sh/uv:\([0-9.]*\)@.*#\1#p' .reference/secure-call-backend/Dockerfile)"
          [ -n "$uv_version" ] || { echo "no pinned uv in the backend's Dockerfile"; exit 1; }
          echo "version=$uv_version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.backend-uv.outputs.version }}
          enable-cache: false
      - name: Backend dependencies (locked, no dev tools)
        working-directory: .reference/secure-call-backend
        run: uv sync --locked --no-dev

      - name: Playwright's browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Build against the local signaling server
        env:
          VITE_SIGNALING_URL: ws://localhost:8000/ws/signal/
        run: pnpm build
      - name: End-to-end tests
        run: pnpm --filter @secure-call/web test:e2e

      # Traces and screenshots hold fake camera frames and test data only: call links (with their
      # secret after the #), room IDs and encrypted frames of a backend thrown away with the job.
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The same commit must build to byte-identical files, which is what lets anyone rebuild a
  # release and compare it with its published SHA256SUMS (deploy-web.yml, SECURITY.md). Two
  # clean builds that share nothing (no cache, no store): Linux with the deploy build's
  # environment, and macOS (another OS, CPU and native build binaries) at a longer path, in
  # another time zone and locale, with almost no environment, as the deploy's rebuild runs.
  # Both use SOURCE_DATE_EPOCH from the commit; every file of dist/ must match.
  reproducible-build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            folder: first
          - runner: macos-15
            folder: second/in/a/longer/path
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ matrix.folder }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ matrix.folder }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ matrix.folder }}/.node-version
      - name: Build as the deploy's build job does
        if: runner.os == 'Linux'
        working-directory: ${{ matrix.folder }}
        run: |
          pnpm install --frozen-lockfile
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" pnpm build
      - name: Build as the deploy's rebuild job does
        if: runner.os == 'macOS'
        working-directory: ${{ matrix.folder }}
        run: |
          commit_time="$(git log -1 --format=%ct)"
          umask 077
          env -i PATH="$PATH" HOME="$HOME" LANG=C TZ=Pacific/Auckland pnpm install --frozen-lockfile
          env -i PATH="$PATH" HOME="$HOME" LANG=C TZ=Pacific/Auckland SOURCE_DATE_EPOCH="$commit_time" pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducible-build-${{ runner.os }}
          path: ${{ matrix.folder }}/apps/web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  reproducible-build-compare:
    needs: reproducible-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reproducible-build-Linux
          path: linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reproducible-build-macOS
          path: macos
      - name: Both builds are byte-identical
        run: |
          (cd linux && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > linux.sums
          (cd macos && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > macos.sums
          cat linux.sums
          grep -q '  ./index.html$' linux.sums || { echo "no index.html was built"; exit 1; }
          if diff linux.sums macos.sums; then
            echo "Reproducible: the Linux and macOS builds are byte-identical."
          else
            echo "NOT reproducible: the two builds differ (see above)."
            exit 1
          fi
